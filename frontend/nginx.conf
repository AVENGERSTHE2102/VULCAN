server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 120s; }
    location /health { proxy_pass http://api:8000; }
    location / { try_files $uri /index.html; }
}
